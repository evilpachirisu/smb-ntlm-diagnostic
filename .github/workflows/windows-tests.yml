name: Windows tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python verify_environment.py --output validation/windows-ci-result.json
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/Start-SmbDiagnostic.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw $errors }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results-${{ matrix.python }}
          path: validation/windows-ci-result.json
